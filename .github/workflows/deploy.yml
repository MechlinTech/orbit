name: Build and Deploy

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: mechlin-orbit-main
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/mechlin-orbit
  IMAGE_TAG: dev

jobs:
  deploy:
    name: Build and Deploy
    runs-on: [self-hosted, windows]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.17.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run checks
        run: npm run check

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build `
            --target production `
            --tag "${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}" `
            --tag "${{ env.IMAGE_NAME }}:${{ github.sha }}" `
            .

      - name: Push Docker image
        run: |
          docker push "${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
          docker push "${{ env.IMAGE_NAME }}:${{ github.sha }}"

      - name: Create deployment environment
        shell: powershell
        run: |
          @"
          NODE_ENV=${{ secrets.NODE_ENV }}
          HOST=${{ secrets.HOST }}
          PORT=${{ secrets.PORT }}
          APP_ORIGIN=${{ secrets.APP_ORIGIN }}
          ALLOWED_DOMAINS=${{ secrets.ALLOWED_DOMAINS }}
          DATABASE_PATH=${{ secrets.DATABASE_PATH }}
          SESSION_SECONDS=${{ secrets.SESSION_SECONDS }}
          DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
          "@ | Set-Content -Path ".env.dev" -Encoding UTF8

      - name: Pull Docker image
        shell: powershell
        run: |
          docker pull "${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"

      - name: Deploy
        shell: powershell
        run: |
          docker compose `
            --env-file .env.dev `
            -f docker-compose.dev.yml `
            up `
            -d `
            --no-build `
            --remove-orphans

      - name: Verify deployment
        shell: powershell
        run: |
          docker compose `
            --env-file .env.dev `
            -f docker-compose.dev.yml `
            ps

      - name: Show logs on failure
        if: failure()
        shell: powershell
        run: |
          docker compose `
            --env-file .env.dev `
            -f docker-compose.dev.yml `
            logs --tail=200

      - name: Cleanup secrets
        if: always()
        shell: powershell
        run: |
          if (Test-Path ".env.dev") {
            Remove-Item ".env.dev" -Force
          }