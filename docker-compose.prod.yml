services:
  app:
    container_name: mechlin-orbit-prod

    build:
      context: .
      dockerfile: Dockerfile
      target: production

    # Must match the tag built/pushed by .github/workflows/deploy.yml
    # (production). Local overrides: IMAGE_NAME / IMAGE_TAG.
    image: ${IMAGE_NAME:-mechlin-orbit}:${IMAGE_TAG:-production}

    restart: unless-stopped

    environment:
      NODE_ENV: ${NODE_ENV}
      HOST: 0.0.0.0
      PORT: 3000
      APP_ORIGIN: ${APP_ORIGIN}
      ALLOWED_DOMAINS: ${ALLOWED_DOMAINS}
      DATABASE_PATH: ${DATABASE_PATH}
      SESSION_SECONDS: ${SESSION_SECONDS}
      ENTRA_TENANT_ID: ${ENTRA_TENANT_ID}
      ENTRA_CLIENT_ID: ${ENTRA_CLIENT_ID}
      ENTRA_CLIENT_SECRET: ${ENTRA_CLIENT_SECRET}
#      ALLOWED_GROUP_IDS: ${ALLOWED_GROUP_IDS}

    ports:
      - "26370:3000"

    volumes:
      - mechlin_orbit_data:/app/data
      - mechlin_orbit_backups:/app/backups

    networks:
      - mechlin-orbit

networks:
  mechlin-orbit:
    driver: bridge

volumes:
  mechlin_orbit_data:
  mechlin_orbit_backups: