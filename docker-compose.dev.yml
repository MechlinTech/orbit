
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development

    # Development Docker image
    image: ${IMAGE_NAME:-mechlin-orbit}:${IMAGE_TAG:-development}

    restart: unless-stopped

    environment:
      NODE_ENV: ${NODE_ENV:-development}
      HOST: 0.0.0.0
      PORT: 3000
      APP_ORIGIN: ${APP_ORIGIN}
      ALLOWED_DOMAINS: ${ALLOWED_DOMAINS}
      DATABASE_PATH: ${DATABASE_PATH}
      SESSION_SECONDS: ${SESSION_SECONDS}
      ENTRA_TENANT_ID: ${ENTRA_TENANT_ID}
      ENTRA_CLIENT_ID: ${ENTRA_CLIENT_ID}
      ENTRA_CLIENT_SECRET: ${ENTRA_CLIENT_SECRET}
      # ALLOWED_GROUP_IDS: ${ALLOWED_GROUP_IDS}

    ports:
      - "60155:3000"

    volumes:
      - mechlin_orbit_dev_data:/app/data
      - mechlin_orbit_dev_backups:/app/backups

    networks:
      - mechlin-orbit-dev

networks:
  mechlin-orbit-dev:
    name: mechlin-orbit-dev-network
    driver: bridge

volumes:
  mechlin_orbit_dev_data:
    name: mechlin_orbit_dev_data

  mechlin_orbit_dev_backups:
    name: mechlin_orbit_dev_backups
